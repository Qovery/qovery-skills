version: 2.1

jobs:
  qovery-deploy:
    docker:
      - image: cimg/base:stable
    environment:
      QOVERY_CONTAINER_ID: <container uuid>
    steps:
      - run:
          name: Deploy the pushed commit
          command: |
            curl -sS --fail-with-body -X POST "https://api.qovery.com/container/$QOVERY_CONTAINER_ID/deploy" \
              -H "Authorization: Token $QOVERY_API_TOKEN" \
              -H "User-Agent: QoverySkill/qovery-switch-source (version:__QOVERY_SKILLS_VERSION__; https://github.com/Qovery/qovery-skills)" \
              -H "Content-Type: application/json" \
              -d "{\"git_commit_id\": \"$CIRCLE_SHA1\"}"

workflows:
  deploy:
    jobs:
      - qovery-deploy:
          context: qovery
          filters:
            branches:
              only: main
