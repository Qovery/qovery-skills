[package]
name = "skill-run"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
