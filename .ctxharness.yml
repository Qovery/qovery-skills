# ctxharness configuration — https://ctxharness.bruniaux.com
#
# This repo is a markdown-based skills library (8 Qovery skills shipped as
# Agent Skills), not a Node/Python/Go/Rust app. Drift here means:
#
#   - README.md or install.sh references a skill / slash command / path
#     that no longer exists on disk
#   - SKILL.md files (the agent prompts) bit-rot vs upstream Qovery
#   - README balloons in token weight or starts using vague guidance
#
# Run:
#   ctxharness check    # text report
#   ctxharness doctor   # L1/L2/L3 breakdown
#   ctxharness score    # 0-100 grade
#
version: 1

files:
  include:
    - 'README.md'
    - 'qovery-*/SKILL.md'
    - 'qovery-*/commands/*.md'
  exclude:
    - 'node_modules/**'
    - '.git/**'
    - '.claude/**'
    - '.ctxharness/**'

assertions:

  # ─────────────────────────────────────────────────────────────────────
  # L1 — Skill directories must exist. These literals are checked in
  # README.md only (the user-facing index that advertises every skill).
  # If README mentions a skill, the matching SKILL.md must exist on disk.
  # ─────────────────────────────────────────────────────────────────────

  - id: skill-onboard-exists
    label: 'qovery-onboard SKILL.md exists'
    extractor: fileExists
    extractorArgs:
      path: qovery-onboard/SKILL.md
    scanner: literalInMd
    scannerArgs:
      literal: qovery-onboard
    scopeFiles:
      include:
        - 'README.md'

  - id: skill-deploy-exists
    label: 'qovery-deploy SKILL.md exists'
    extractor: fileExists
    extractorArgs:
      path: qovery-deploy/SKILL.md
    scanner: literalInMd
    scannerArgs:
      literal: qovery-deploy
    scopeFiles:
      include:
        - 'README.md'

  - id: skill-troubleshoot-exists
    label: 'qovery-troubleshoot SKILL.md exists'
    extractor: fileExists
    extractorArgs:
      path: qovery-troubleshoot/SKILL.md
    scanner: literalInMd
    scannerArgs:
      literal: qovery-troubleshoot
    scopeFiles:
      include:
        - 'README.md'

  - id: skill-optimize-exists
    label: 'qovery-optimize SKILL.md exists'
    extractor: fileExists
    extractorArgs:
      path: qovery-optimize/SKILL.md
    scanner: literalInMd
    scannerArgs:
      literal: qovery-optimize
    scopeFiles:
      include:
        - 'README.md'

  - id: skill-speedup-exists
    label: 'qovery-speedup SKILL.md exists'
    extractor: fileExists
    extractorArgs:
      path: qovery-speedup/SKILL.md
    scanner: literalInMd
    scannerArgs:
      literal: qovery-speedup
    scopeFiles:
      include:
        - 'README.md'

  - id: skill-preview-exists
    label: 'qovery-preview SKILL.md exists'
    extractor: fileExists
    extractorArgs:
      path: qovery-preview/SKILL.md
    scanner: literalInMd
    scannerArgs:
      literal: qovery-preview
    scopeFiles:
      include:
        - 'README.md'

  - id: skill-builder-env-exists
    label: 'qovery-builder-env SKILL.md exists'
    extractor: fileExists
    extractorArgs:
      path: qovery-builder-env/SKILL.md
    scanner: literalInMd
    scannerArgs:
      literal: qovery-builder-env
    scopeFiles:
      include:
        - 'README.md'

  - id: skill-builder-portal-exists
    label: 'qovery-builder-portal SKILL.md exists'
    extractor: fileExists
    extractorArgs:
      path: qovery-builder-portal/SKILL.md
    scanner: literalInMd
    scannerArgs:
      literal: qovery-builder-portal
    scopeFiles:
      include:
        - 'README.md'

  # ─────────────────────────────────────────────────────────────────────
  # L1 — Slash command files must exist. README's "Slash Commands"
  # section advertises each as /qovery-X — that's where we check.
  # ─────────────────────────────────────────────────────────────────────

  - id: cmd-onboard-exists
    label: '/qovery-onboard slash command file'
    extractor: fileExists
    extractorArgs:
      path: qovery-onboard/commands/qovery-onboard.md
    scanner: literalInMd
    scannerArgs:
      literal: '/qovery-onboard'
    scopeFiles:
      include:
        - 'README.md'

  - id: cmd-deploy-exists
    label: '/qovery-deploy slash command file'
    extractor: fileExists
    extractorArgs:
      path: qovery-deploy/commands/qovery-deploy.md
    scanner: literalInMd
    scannerArgs:
      literal: '/qovery-deploy'
    scopeFiles:
      include:
        - 'README.md'

  - id: cmd-troubleshoot-exists
    label: '/qovery-troubleshoot slash command file'
    extractor: fileExists
    extractorArgs:
      path: qovery-troubleshoot/commands/qovery-troubleshoot.md
    scanner: literalInMd
    scannerArgs:
      literal: '/qovery-troubleshoot'
    scopeFiles:
      include:
        - 'README.md'

  - id: cmd-optimize-exists
    label: '/qovery-optimize slash command file'
    extractor: fileExists
    extractorArgs:
      path: qovery-optimize/commands/qovery-optimize.md
    scanner: literalInMd
    scannerArgs:
      literal: '/qovery-optimize'
    scopeFiles:
      include:
        - 'README.md'

  - id: cmd-speedup-exists
    label: '/qovery-speedup slash command file'
    extractor: fileExists
    extractorArgs:
      path: qovery-speedup/commands/qovery-speedup.md
    scanner: literalInMd
    scannerArgs:
      literal: '/qovery-speedup'
    scopeFiles:
      include:
        - 'README.md'

  - id: cmd-preview-exists
    label: '/qovery-preview slash command file'
    extractor: fileExists
    extractorArgs:
      path: qovery-preview/commands/qovery-preview.md
    scanner: literalInMd
    scannerArgs:
      literal: '/qovery-preview'
    scopeFiles:
      include:
        - 'README.md'

  - id: cmd-builder-env-exists
    label: '/qovery-builder-env slash command file'
    extractor: fileExists
    extractorArgs:
      path: qovery-builder-env/commands/qovery-builder-env.md
    scanner: literalInMd
    scannerArgs:
      literal: '/qovery-builder-env'
    scopeFiles:
      include:
        - 'README.md'

  - id: cmd-builder-portal-exists
    label: '/qovery-builder-portal slash command file'
    extractor: fileExists
    extractorArgs:
      path: qovery-builder-portal/commands/qovery-builder-portal.md
    scanner: literalInMd
    scannerArgs:
      literal: '/qovery-builder-portal'
    scopeFiles:
      include:
        - 'README.md'

  # ─────────────────────────────────────────────────────────────────────
  # L1 — install.sh referenced from README must exist on disk.
  # local-install.sh is dev-only and not advertised in README, so we
  # don't track it here.
  # ─────────────────────────────────────────────────────────────────────

  - id: install-sh-exists
    label: 'install.sh exists'
    extractor: fileExists
    extractorArgs:
      path: install.sh
    scanner: literalInMd
    scannerArgs:
      literal: 'install.sh'
    scopeFiles:
      include:
        - 'README.md'

  # ─────────────────────────────────────────────────────────────────────
  # L2 — Token budget. README is the front door; SKILL.md files are the
  # agent prompts loaded on demand. Different budgets per scope.
  # ─────────────────────────────────────────────────────────────────────

  - id: readme-context-budget
    label: 'README.md token budget'
    extractor: constant
    extractorArgs:
      value: check
    scanner: contextBudget
    scannerArgs:
      maxTokens: 9000        # README is ~7k tokens today; some headroom
      followImports: false
    scopeFiles:
      include:
        - 'README.md'

  - id: skill-md-context-budget
    label: 'SKILL.md token budget (per-skill)'
    extractor: constant
    extractorArgs:
      value: check
    scanner: contextBudget
    scannerArgs:
      maxTokens: 35000       # qovery-deploy is ~30k; ceiling at 35k
      followImports: false
    scopeFiles:
      include:
        - 'qovery-*/SKILL.md'

  # ─────────────────────────────────────────────────────────────────────
  # L2 — Vagueness only on user-facing README. SKILL.md files are agent
  # prompts and intentionally use conditional language ("if X then Y"),
  # so vagueness scanning would be too noisy there.
  # ─────────────────────────────────────────────────────────────────────

  - id: readme-no-vague-language
    label: 'README avoids vague guidance'
    extractor: constant
    extractorArgs:
      value: check
    scanner: vaguenessPattern
    scopeFiles:
      include:
        - 'README.md'

  # ─────────────────────────────────────────────────────────────────────
  # L3 — Freshness. Warn if a SKILL.md hasn't been touched in many
  # commits — Qovery's API/CLI evolves and stale skills mislead agents.
  # Thresholds are generous: skills are large and don't need weekly edits.
  # ─────────────────────────────────────────────────────────────────────

  - id: skill-onboard-freshness
    label: 'qovery-onboard freshness'
    extractor: gitStaleness
    extractorArgs:
      path: qovery-onboard/SKILL.md
    scanner: freshnessScore
    scannerArgs:
      warnAfter: 75
      failAfter: 250

  - id: skill-deploy-freshness
    label: 'qovery-deploy freshness'
    extractor: gitStaleness
    extractorArgs:
      path: qovery-deploy/SKILL.md
    scanner: freshnessScore
    scannerArgs:
      warnAfter: 75
      failAfter: 250

  - id: skill-troubleshoot-freshness
    label: 'qovery-troubleshoot freshness'
    extractor: gitStaleness
    extractorArgs:
      path: qovery-troubleshoot/SKILL.md
    scanner: freshnessScore
    scannerArgs:
      warnAfter: 75
      failAfter: 250

  - id: skill-optimize-freshness
    label: 'qovery-optimize freshness'
    extractor: gitStaleness
    extractorArgs:
      path: qovery-optimize/SKILL.md
    scanner: freshnessScore
    scannerArgs:
      warnAfter: 75
      failAfter: 250

  - id: skill-speedup-freshness
    label: 'qovery-speedup freshness'
    extractor: gitStaleness
    extractorArgs:
      path: qovery-speedup/SKILL.md
    scanner: freshnessScore
    scannerArgs:
      warnAfter: 75
      failAfter: 250

  - id: skill-preview-freshness
    label: 'qovery-preview freshness'
    extractor: gitStaleness
    extractorArgs:
      path: qovery-preview/SKILL.md
    scanner: freshnessScore
    scannerArgs:
      warnAfter: 75
      failAfter: 250

  - id: skill-builder-env-freshness
    label: 'qovery-builder-env freshness'
    extractor: gitStaleness
    extractorArgs:
      path: qovery-builder-env/SKILL.md
    scanner: freshnessScore
    scannerArgs:
      warnAfter: 75
      failAfter: 250

  - id: skill-builder-portal-freshness
    label: 'qovery-builder-portal freshness'
    extractor: gitStaleness
    extractorArgs:
      path: qovery-builder-portal/SKILL.md
    scanner: freshnessScore
    scannerArgs:
      warnAfter: 75
      failAfter: 250
